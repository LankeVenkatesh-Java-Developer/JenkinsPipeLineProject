version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: crud-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Venky@314}
      MYSQL_DATABASE: crud_db
      MYSQL_USER: ${MYSQL_USER:-crud_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crud_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - crud-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crud-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/crud_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-crud_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-crud_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - crud-network
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local

networks:
  crud-network:
    driver: bridge
